name: CI/CD

on:
  push:
    branches: [ main, homolog ]
  pull_request:
    branches: [ main, homolog ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x ./mvnw || true
          if [ -f ./mvnw ]; then
            ./mvnw -B verify
          else
            mvn -B verify
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker-image:
    name: Build Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: billing-service:latest
          outputs: type=docker,dest=/tmp/billing-service.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-service-image
          path: /tmp/billing-service.tar

  deploy-k8s:
    name: Deploy to Kubernetes (kind)
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: billing-service-image
          path: /tmp

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: billing-cluster

      - name: Load image into kind
        run: |
          docker load --input /tmp/billing-service.tar
          kind load docker-image billing-service:latest --name billing-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-mongodb.yaml
          kubectl apply -f k8s/04-rabbitmq.yaml
          kubectl apply -f k8s/05-app.yaml
          kubectl apply -f k8s/06-hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl -n oficina rollout status deployment/mongodb --timeout=180s
          kubectl -n oficina rollout status deployment/rabbitmq --timeout=180s
          kubectl -n oficina rollout status deployment/billing-service --timeout=240s || true
          kubectl -n oficina get all
