apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: oficina
data:
  SERVER_PORT: "8082"
  MONGODB_URI: "mongodb://mongodb:27017/billing_db"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "guest"
  MERCADO_PAGO_BASE_URL: "https://api.mercadopago.com"
  MERCADO_PAGO_MOCK_ENABLED: "false"
  MERCADO_PAGO_NOTIFICATION_URL: "http://billing-service:8082/api/pagamentos/webhook"
  MERCADO_PAGO_SUCCESS_URL: "http://localhost:3000/pagamento/sucesso"
  MERCADO_PAGO_FAILURE_URL: "http://localhost:3000/pagamento/falha"
  MERCADO_PAGO_PENDING_URL: "http://localhost:3000/pagamento/pendente"
